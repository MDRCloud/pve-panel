name: Sync with Upstream
run-name: Upstream Sync (${{ github.actor }})

on:
  schedule:
    # Run automatically every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    name: Sync main from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: sebastianflint/pve-panel
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Automatically merge upstream commits if clean; fail gracefully if merge conflict
          test_mode: false

      - name: Check sync output
        if: success()
        run: |
          echo "Sync result: ${{ steps.sync.outputs.has_new_commits }}"

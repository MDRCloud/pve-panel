services:
  panel:
    build: .
    image: mdrcloud-lxc-panel:latest
    init: true
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      HOST: 0.0.0.0
      ADMIN_HOST: 0.0.0.0
      DB_PATH: /app/data/panel.db
      BRANDING_DIR: /app/branding
    volumes:
      - ./data:/app/data
      - ./branding:/app/branding:ro
